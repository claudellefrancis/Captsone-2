<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Claudelle</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <h1>Contact Me</h1>

    <header>
        <img src="images/logo.png" alt="Logo">

        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" class="current-page">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-container">
        <h2>Get In Touch</h2>

        <form class="form-group">
            <label for="name">Name:</label>
            <input
                type="text"
                id="name"
                name="name"
                required
                minlength="2"
                maxlength="20"
                pattern="[A-Za-z ]+">

            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                required
                minlength="2"
                maxlength="100">

            <label for="service">Service:</label>
            <select id="service" name="service">
                <option>Web Design</option>
                <option>Web Development</option>
                <option>Consulting</option>
            </select>

            <fieldset>
                <legend>Project Type</legend>
                    <label for="business">Business</label>
                    <input type="radio" id="business" name="project" value="business">

                    <label for="personal">Personal</label>
                    <input type="radio" id="personal" name="project" value="personal">
            </fieldset>

            <p class="newsletter">
            <input type="checkbox" id="newsletter" name="newsletter">
            <label for="newsletter">Subscribe to newsletter</label>
            </p>

            <label for="message">Message:</label>
            <textarea id="message" name="message" minlength="2" maxlength="500" required></textarea>

            <button class="contact-btn" type="submit">Send Message</button>
        </form>
    </section>

    <footer class="footer">
        <p>&copy; 2026 Claudelle Francis. All rights reserved.</p>

        <p>
            Email:
                <a href="mailto:claudelle.francis@umuzi.org">claudelle.francis@umuzi.org
                </a>
        </p>
    </footer>
    </main>
</body>
</html>
